<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NU-CLEAR v5 — Nuclear War Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;font-family:'Courier New',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#root{display:flex;flex-direction:column;height:100vh}
#map{flex:1;z-index:1;min-height:0}
.leaflet-container{background:#0d1117}
.leaflet-tile-pane{filter:brightness(0.7) saturate(0.6)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.nation-marker{cursor:pointer;transition:transform .2s}
.nation-marker:hover{transform:scale(1.3)}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
@keyframes explode{0%{transform:scale(0);opacity:1}60%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes warPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 20px 4px rgba(239,68,68,0.4)}}
.war-active{animation:warPulse 1.5s infinite}
.slide-in{animation:slideIn .3s ease}
.missile-dot{width:8px;height:8px;background:#fbbf24;border-radius:50%;position:absolute;pointer-events:none;box-shadow:0 0 6px #fbbf24}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  {id:"uk",name:"United Kingdom",flag:"🇬🇧",lat:54,lon:-2,color:"#8b5cf6",warheads:225,covert:0,gdp:13.1,mil:72,tech:86,def:78,bloc:"NATO",allies:["us","france","australia"],rivals:["russia"],specials:["Trident II D5 SLBM","Astute-class Nuclear Sub","SAS Special Forces","Dreadnought SSBN (2030)","GCHQ Cyber Intelligence"],fp:"Minimum credible deterrent. Always retaliates if existential threat. US integrated command."},

  {id:"pakistan",name:"Pakistan",flag:"🇵🇰",lat:30,lon:69,color:"#10b981",warheads:165,covert:30,gdp:4.4,mil:65,tech:60,def:62,bloc:"SCO",allies:["china","nkorea"],rivals:["india"],specials:["Nasr Battlefield Nuke (60km)","Babur Cruise Missile","JF-17 Nuclear Capable","Shaheen-3 IRBM","ISI Asymmetric Warfare"],fp:"First use IS on the table against India. Tactical nukes deployed at forward positions. China backs unconditionally."},
  {id:"israel",name:"Israel",flag:"🇮🇱",lat:31,lon:35,color:"#06b6d4",warheads:90,covert:130,gdp:6.0,mil:78,tech:92,def:88,bloc:"Western",allies:["us"],rivals:["iran","hezbollah","hamas"],specials:["Iron Dome (99.3% intercept)","Arrow-3 Exo-atmospheric","Jericho-3 ICBM","Unit 8200 Cyber (Stuxnet)","Dolphin-class Sub (nuclear)","Laser Air Defense (2024)"],fp:"Samson Option: if state destroyed, all regional capitals destroyed. Neither confirm nor deny nukes."},
  {id:"nkorea",name:"North Korea",flag:"🇰🇵",lat:40,lon:127,color:"#84cc16",warheads:40,covert:20,gdp:1.0,mil:58,tech:42,def:55,bloc:"SCO",allies:["russia","china"],rivals:["us","skorea","japan"],specials:["Hwasong-17 ICBM (15,000km)","KN-23 Tactical Nuke","Submarine-Launched Ballistic Missile","EMP Weapon Tested","Cyber Bureau 121 (elite hackers)"],fp:"Kim personally controls launch. Regime survival = nuclear use. No predictable doctrine."},
  {id:"iran",name:"Iran",flag:"🇮🇷",lat:32,lon:53,color:"#a78bfa",warheads:0,covert:2000,gdp:4.1,mil:62,tech:58,def:60,bloc:"Non-Aligned",allies:["russia","nkorea","hezbollah","houthi"],rivals:["us","israel","saudi"],specials:["Shahab-3 IRBM","Fattah Hypersonic Missile","Proxy Network (Hezbollah/Houthi/Hamas)","Strait of Hormuz Control","Cyber APT33/34","Covert Warheads (unconfirmed ~2000)"],fp:"Officially non-nuclear. Intelligence estimates 2,000 covert devices. Proxy warfare is primary doctrine."},
  {id:"skorea",name:"South Korea",flag:"🇰🇷",lat:37,lon:127,color:"#fb7185",warheads:0,covert:0,gdp:7.2,mil:68,tech:88,def:82,bloc:"NATO",allies:["us","japan"],rivals:["nkorea","china"],specials:["K2 Black Panther (best MBT)","THAAD Missile Defense","KF-21 Boramae 5th-Gen Fighter","Hyunmoo-4 Ballistic Missile (800km)","Cyber Command (world-class)","Kill Chain Pre-emptive Strike System"],fp:"No nukes but Kill Chain doctrine: pre-emptive strike on NK launch detected. US nuclear umbrella."},
  {id:"japan",name:"Japan",flag:"🇯🇵",lat:36,lon:138,color:"#f472b6",warheads:0,covert:0,gdp:8.8,mil:60,tech:95,def:85,bloc:"NATO",allies:["us","skorea","australia"],rivals:["nkorea","china","russia"],specials:["Aegis Ashore Missile Defense","F-35A/B Stealth (147 units)","Izumo Carrier (quasi)","SM-3 Block IIA Interceptor","Type 12 SSM (1,500km upgrade)","Potential breakout: 6,000+ warheads in months (plutonium stockpile)"],fp:"Pacifist constitution. But plutonium for 6,000 bombs stockpiled. One policy change = nuclear overnight."},
  {id:"saudi",name:"Saudi Arabia",flag:"🇸🇦",lat:24,lon:45,color:"#fbbf24",warheads:0,covert:0,gdp:8.9,mil:65,tech:62,def:64,bloc:"Non-Aligned",allies:["us","pakistan"],rivals:["iran","houthi"],specials:["Patriot PAC-3 Batteries","CSS-5 Ballistic Missile (from China)","F-15SA Advanced Eagle","THAAD (ordered)","Pakistan Nuclear Pact (if Iran nukes, Pak provides warheads)"],fp:"No nukes. But secret pact with Pakistan: if Iran goes nuclear, Saudi gets warheads within days."},
  {id:"ukraine",name:"Ukraine",flag:"🇺🇦",lat:49,lon:32,color:"#60a5fa",warheads:0,covert:0,gdp:5.0,mil:55,tech:68,def:58,bloc:"Non-Aligned",allies:["us","uk","france","poland"],rivals:["russia","belarus"],specials:["Gave up 1,900 nukes in 1994 (Budapest Memo)","Neptune Anti-Ship Missile (sank Moskva)","FPV Drone Warfare Pioneer","Starlink Integration","Western HIMARS/Leopard","Bayraktar TB2 Drones"],fp:"Non-nuclear. Budapest Memorandum gave up arsenal for security guarantees. How did that work out."},
  {id:"taiwan",name:"Taiwan",flag:"🇹🇼",lat:23.5,lon:121,color:"#34d399",warheads:0,covert:0,gdp:4.5,mil:58,tech:90,def:75,bloc:"Non-Aligned",allies:["us"],rivals:["china"],specials:["TSMC — 90% world advanced chips","Hsiung Feng III Supersonic Missile","Tien Kung Air Defense","F-16V Block 70","Asymmetric Porcupine Strategy","Economic Leverage: Global chip supply"],fp:"No nukes but destroying TSMC = global recession. Economic deterrence is Taiwan's nuclear option."},
];

const BLOC_DATA={
  NATO:{name:"NATO",color:"#1d4ed8",members:["us","uk","france","skorea","japan","australia","ukraine","taiwan"]},
  SCO:{name:"SCO",color:"#991b1b",members:["russia","china","pakistan","nkorea","iran","belarus"]},
  "Non-Aligned":{name:"Non-Aligned",color:"#78350f",members:["india","iran","ukraine","taiwan","saudi"]},
  Western:{name:"Western",color:"#0e7490",members:["israel","us","uk"]},
};

const WAR_OUTCOMES={
  NATO_wins:"NATO coalition achieves strategic dominance. Russian and Chinese economies collapse under sanctions. SCO fragments. New world order: US-led multilateral framework. Reconstruction begins.",
  SCO_wins:"SCO bloc achieves Eurasian dominance. Dollar dethroned. NATO fractures. New Silk Road replaces Western financial system. US retreats to Western Hemisphere.",
  mutualDestruction:"Global nuclear exchange. 4 billion dead in 90 days. Nuclear winter for 10 years. Civilization reset. The cockroaches inherit the Earth. Well played.",
  diplomatic:"Back-channel negotiations succeed. Emergency UN session. Temporary ceasefire holds. Both sides claim victory. Nothing actually resolved. See you in 10 years.",
  india_emerges:"India-Russia-China axis dominates. Western hegemony ends. Multipolar world emerges. India becomes third superpower. Pakistan very uncomfortable about this.",
};

const TRUMP_LINES=[
  "Tremendous. Very nuclear. The best nuclear. Nobody does nuclear like me.",
  "I know an N-word. Starts with N, ends with R. It's NUCLEAR! Beautiful.",
  "They said it couldn't be done. I did it. Was it smart? Ask the historians.",
  "SpongeBob called. Very upset. I said — not personal. Just geopolitics.",
  "The UN wrote a letter. Very nasty. I didn't read it. FAKE DIPLOMACY.",
  "India and Pakistan both great countries. Very close. Too close. Very nuclear.",
  "Russia has Dead Hand. Very scary. I have Twitter. Also very scary.",
  "Iran says no nukes. Intelligence says 2,000 nukes. Who do you believe? Me.",
  "North Korea's Kim — great relationship. He wrote me beautiful letters. Then this.",
  "China has 350 nukes officially. Plus 150 covert. I'm just asking questions.",
];

function getWarheads(n){return n.warheads+(n.covert||0);}
function calcStrength(n){return Math.round((getWarheads(n)*0.3)+(n.mil*2)+(n.tech*1.5)+(n.def*1.5));}

function TrumpFace({size=44}){
  const s=size/52;
  return React.createElement("svg",{width:size,height:size,viewBox:"0 0 52 52",style:{flexShrink:0}},
    React.createElement("ellipse",{cx:26,cy:10,rx:16,ry:9,fill:"#f59e0b"}),
    React.createElement("path",{d:"M10 12 Q8 6 14 4 Q20 2 26 3 Q32 2 38 4 Q44 6 42 12",fill:"#f59e0b"}),
    React.createElement("path",{d:"M10 10 Q18 5 30 8 Q38 10 42 8",fill:"#d97706"}),
    React.createElement("ellipse",{cx:26,cy:28,rx:15,ry:16,fill:"#fb923c"}),
    React.createElement("ellipse",{cx:20,cy:24,rx:3,ry:2.5,fill:"white"}),
    React.createElement("ellipse",{cx:32,cy:24,rx:3,ry:2.5,fill:"white"}),
    React.createElement("circle",{cx:21,cy:24,r:1.5,fill:"#1e293b"}),
    React.createElement("circle",{cx:33,cy:24,r:1.5,fill:"#1e293b"}),
    React.createElement("path",{d:"M20 35 Q26 32 32 35",stroke:"#c2410c",strokeWidth:1.5,fill:"none"}),
    React.createElement("ellipse",{cx:26,cy:35,rx:5,ry:2,fill:"#dc2626"}),
    React.createElement("path",{d:"M17 21 Q20 19 23 21",stroke:"#92400e",strokeWidth:1.5,fill:"none"}),
    React.createElement("path",{d:"M29 21 Q32 19 35 21",stroke:"#92400e",strokeWidth:1.5,fill:"none"}),
    React.createElement("ellipse",{cx:26,cy:30,rx:3,ry:2,fill:"#f97316"}),
    React.createElement("path",{d:"M14 43 L18 38 L26 41 L34 38 L38 43",fill:"white"}),
    React.createElement("rect",{x:14,y:43,width:24,height:6,fill:"#1d4ed8",rx:1})
  );
}

function App(){
  const mapRef=useRef(null);
  const leafletMap=useRef(null);
  const markersRef=useRef({});
  const [screen,setScreen]=useState("menu");
  const [player,setPlayer]=useState(null);
  const [layer,setLayer]=useState("satellite");
  const [tension,setTension]=useState(10);
  const [phase,setPhase]=useState("PEACE"); // PEACE, ESCALATION, REGIONAL_WAR, WORLD_WAR, RESOLVED
  const [turn,setTurn]=useState(1);
  const [warLog,setWarLog]=useState([]);
  const [narrator,setNarrator]=useState(TRUMP_LINES[0]);
  const [activeWar,setActiveWar]=useState(null);
  const [nationStates,setNationStates]=useState(()=>{
    const s={};NATIONS.forEach(n=>{s[n.id]={hp:100,warheads:getWarheads(n),strength:calcStrength(n),status:"neutral",inWar:false};});return s;
  });
  const [selectedAction,setSelectedAction]=useState(null);
  const [warResult,setWarResult]=useState(null);
  const [pendingTarget,setPendingTarget]=useState(null);
  const [showSpecials,setShowSpecials]=useState(null);
  const [tlIdx,setTlIdx]=useState(0);
  const [tlPlaying,setTlPlaying]=useState(false);
  const [showLog,setShowLog]=useState(false);
  const tlTimer=useRef(null);
  const nlTimer=useRef(null);

  const TIMELINE=[
    {year:1945,title:"Trinity Test",lat:33.7,lon:-106.5,kt:21,desc:"First nuclear detonation. J. Robert Oppenheimer: 'Now I am become Death.'",narrator:"They built a sun on Earth. The first thought was how to use it on people. Tremendous science."},
    {year:1945,title:"Hiroshima",lat:34.4,lon:132.5,kt:15,desc:"Little Boy. 80,000 dead instantly. 140,000 by year end.",narrator:"Little Boy. Ironic name. 80,000 before breakfast. Three days later they did it again."},
    {year:1945,title:"Nagasaki",lat:32.8,lon:129.9,kt:21,desc:"Fat Man. Japan surrenders September 2, 1945.",narrator:"Fat Man, they called it. The war ended. The arms race began. Thanks everyone."},
    {year:1949,title:"USSR Joe-1",lat:50.1,lon:78.7,kt:22,desc:"Soviets break US monopoly. Cold War arms race ignites.",narrator:"Americans had 4 years of monopoly. Soviets said hold my vodka. Then there were two."},
    {year:1952,title:"Ivy Mike H-Bomb",lat:11.7,lon:162.4,kt:10400,desc:"First thermonuclear device. 10.4 megatons. 700x Hiroshima.",narrator:"Because fission wasn't terrifying enough. FUSION bombs. 700 Hiroshimas. In one device."},
    {year:1960,title:"France Nuclear",lat:24.1,lon:5.0,kt:70,desc:"France tests Gerboise Bleue. Independent deterrent.",narrator:"France joins the club. Very independently. They don't share codes with NATO. Very French."},
    {year:1962,title:"Cuban Missile Crisis",lat:22,lon:-80,kt:0,desc:"13 days. Nearest to nuclear war. Khrushchev blinks.",narrator:"13 days. Two men. One planet. The most expensive game of chicken ever played."},
    {year:1964,title:"China Nuclear",lat:40.0,lon:93.0,kt:22,desc:"China tests 596. Asia changes forever.",narrator:"China joins. Now four nuclear powers. The UN is typing a strongly worded letter."},
    {year:1974,title:"India Smiling Buddha",lat:27.0,lon:71.7,kt:8,desc:"India's 'Peaceful Nuclear Explosion'. Gandhinagar test.",narrator:"India named their bomb Smiling Buddha. The Buddha was not available for comment."},
    {year:1979,title:"Vela Incident",lat:-46,lon:40,kt:3,desc:"Mystery double-flash. Israeli-South African joint test. Never confirmed.",narrator:"Nobody claimed it. Everyone knew. Israel: neither confirm nor deny. I respect the discretion."},
    {year:1998,title:"India+Pakistan Tests",lat:27,lon:72,kt:45,desc:"India tests Shakti. Pakistan tests Chagai-I within 17 days.",narrator:"India tests Monday. Pakistan tests Thursday. 1.5 billion people. Tremendous neighborhood energy."},
    {year:2006,title:"North Korea Test 1",lat:41,lon:129,kt:1,desc:"DPRK enters nuclear club. World panics.",narrator:"Kim Jong-il woke up and chose chaos. The UN sent a letter. Kim did not read it."},
    {year:2017,title:"DPRK H-Bomb Test",lat:41.3,lon:129.1,kt:250,desc:"North Korea tests thermonuclear device. 250kt yield.",narrator:"Kim tested an H-bomb. Trump said fire and fury. Kim tested again. Nobody blinked."},
    {year:2022,title:"Russia Ukraine — Nuclear Threats",lat:50,lon:32,kt:0,desc:"Russia invades Ukraine. Nuclear sabre-rattling returns to world stage.",narrator:"2022. We thought nuclear threats were retro. They were just resting. Like me between tweets."},
    {year:2024,title:"Current Standoff",lat:20,lon:10,kt:0,desc:"9 declared nuclear states. 12,500 warheads. 2,000 on high alert. Normal Tuesday.",narrator:"Right now. Today. 12,500 warheads. You're playing a game about it. Everything is fine."},
  ];

  // Init Leaflet
  useEffect(()=>{
    if(screen==="game"||screen==="timeline"){
      setTimeout(()=>{
        if(!mapRef.current||leafletMap.current)return;
        const map=L.map(mapRef.current,{center:[20,10],zoom:2,minZoom:2,maxZoom:8,zoomControl:false});
        leafletMap.current=map;
        const osmTile=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19,opacity:0.5});
        const satTile=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"© Esri",maxZoom:19,opacity:0.6});
        const darkTile=L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:"© CartoDB",maxZoom:19,opacity:0.8});
        map._layers_custom={satellite:satTile,political:osmTile,dark:darkTile};
        darkTile.addTo(map);
        map.on("click",()=>{setPendingTarget(null);});
        addNationMarkers(map);
      },100);
    }
    return()=>{
      if(leafletMap.current){leafletMap.current.remove();leafletMap.current=null;markersRef.current={};}
    };
  },[screen]);

  // Layer switch
  useEffect(()=>{
    const map=leafletMap.current;
    if(!map||!map._layers_custom)return;
    Object.values(map._layers_custom).forEach(l=>map.removeLayer(l));
    map._layers_custom[layer].addTo(map);
    map._layers_custom[layer].setZIndex(0);
  },[layer]);

  function addNationMarkers(map){
    NATIONS.forEach(n=>{
      const ns=nationStates[n.id];
      const wh=n.warheads+(n.covert||0);
      const size=wh>1000?44:wh>100?36:wh>0?28:22;
      const icon=L.divIcon({
        className:"",
        html:`<div class="nation-marker" style="
          width:${size}px;height:${size}px;
          background:${n.color}22;
          border:2px solid ${n.color};
          border-radius:50%;
          display:flex;align-items:center;justify-content:center;
          font-size:${size*0.45}px;
          cursor:pointer;
          position:relative;
        ">
          ${n.flag}
          ${wh>0?`<div style="position:absolute;top:-8px;right:-8px;background:#0d1117;border:1px solid ${n.color};border-radius:3px;font-size:7px;color:${n.color};padding:1px 3px;font-family:monospace">☢${wh>=1000?(wh/1000).toFixed(1)+"k":wh}</div>`:""}
        </div>`,
        iconSize:[size,size],iconAnchor:[size/2,size/2],
      });
      const marker=L.marker([n.lat,n.lon],{icon,zIndexOffset:1000}).addTo(map);
      marker.on("click",(e)=>{
        L.DomEvent.stopPropagation(e);
        handleNationClick(n);
      });
      markersRef.current[n.id]=marker;
    });
  }

  function handleNationClick(n){
    if(screen==="timeline"){setShowSpecials(n);return;}
    if(!player)return;
    if(n.id===player.id){setShowSpecials(n);return;}
    setPendingTarget(n);
  }

  // Narrator rotation
  useEffect(()=>{
    nlTimer.current=setInterval(()=>{
      if(!activeWar)setNarrator(TRUMP_LINES[Math.floor(Math.random()*TRUMP_LINES.length)]);
    },9000);
    return()=>clearInterval(nlTimer.current);
  },[activeWar]);

  function addLog(entry){setWarLog(l=>[entry,...l].slice(0,30));}

  function calcBlocStrength(side){
    return side.reduce((acc,id)=>{
      const n=NATIONS.find(x=>x.id===id);
      const ns=nationStates[id];
      if(!n||!ns||ns.status==="destroyed")return acc;
      return acc+(ns.strength*(ns.hp/100));
    },0);
  }

  function launchStrike(attacker,target,type="nuclear"){
    const atk=NATIONS.find(n=>n.id===attacker);
    const tgt=NATIONS.find(n=>n.id===target);
    if(!atk||!tgt)return;

    // Fly missile on map
    if(leafletMap.current){
      const line=L.polyline([[atk.lat,atk.lon],[tgt.lat,tgt.lon]],{color:"#fbbf24",weight:2,dashArray:"6 4",opacity:0.8}).addTo(leafletMap.current);
      setTimeout(()=>line.remove(),3000);
      const circle=L.circle([tgt.lat,tgt.lon],{radius:type==="nuclear"?800000:400000,color:"#ef4444",fillColor:"#ef4444",fillOpacity:0.2,weight:2}).addTo(leafletMap.current);
      setTimeout(()=>circle.remove(),4000);
      leafletMap.current.flyTo([tgt.lat,tgt.lon],3,{duration:1.2});
    }

    const damage=type==="nuclear"?Math.round(20+Math.random()*25):Math.round(5+Math.random()*12);
    setNationStates(prev=>{
      const next={...prev};
      next[target]={...next[target],hp:Math.max(0,next[target].hp-damage),warheads:Math.max(0,next[target].warheads-Math.round(Math.random()*5))};
      if(next[target].hp<=0)next[target].status="destroyed";
      return next;
    });
    return damage;
  }

  function executeTurn(action,tgt){
    if(!player||!activeWar)return;
    const atk=player;
    const defNation=tgt;
    const damage=launchStrike(atk.id,defNation.id,action);
    const newTurn=turn+1;
    setTurn(newTurn);

    let logEntries=[];
    logEntries.push({turn:newTurn-1,type:action,text:`TURN ${newTurn-1}: 🚀 ${atk.flag} ${atk.name} ${action==="nuclear"?"launches NUCLEAR strike":"conducts military operation"} on ${defNation.flag} ${defNation.name}. DAMAGE: -${damage}HP`});

    // Enemy retaliation
    const warData=activeWar;
    const enemySide=warData.sides[warData.playerSide==="attackers"?"defenders":"attackers"];
    const activeFoes=enemySide.filter(id=>{const ns=nationStates[id];return ns&&ns.hp>0&&ns.status!=="destroyed";});

    activeFoes.slice(0,2).forEach((foeId,i)=>{
      setTimeout(()=>{
        const foe=NATIONS.find(n=>n.id===foeId);
        const retDmg=launchStrike(foeId,atk.id,nationStates[foeId]?.warheads>100?"nuclear":"conventional");
        const reaction=getReaction(foe,atk,newTurn);
        logEntries.push({turn:newTurn,type:"retaliation",text:`TURN ${newTurn}: ${foe.flag} ${foe.name} RETALIATES — ${reaction} DAMAGE TO YOU: -${retDmg}HP`});
        setNationStates(prev=>{
          const next={...prev};
          next[atk.id]={...next[atk.id],hp:Math.max(0,next[atk.id].hp-retDmg)};
          return next;
        });
        setWarLog(l=>[...logEntries,...l].slice(0,30));
        setNarrator(TRUMP_LINES[Math.floor(Math.random()*TRUMP_LINES.length)]);
      },(i+1)*1500);
    });

    // Ally support
    const playerSideIds=warData.sides[warData.playerSide];
    const activeAllies=playerSideIds.filter(id=>id!==atk.id&&nationStates[id]?.hp>0);
    activeAllies.slice(0,1).forEach((allyId,i)=>{
      setTimeout(()=>{
        const ally=NATIONS.find(n=>n.id===allyId);
        const randFoe=activeFoes[Math.floor(Math.random()*activeFoes.length)];
        if(!randFoe)return;
        const allyDmg=launchStrike(allyId,randFoe,nationStates[allyId]?.warheads>50?"nuclear":"conventional");
        logEntries.push({turn:newTurn,type:"ally",text:`ALLY ${ally.flag} ${ally.name} enters the fight → hits ${NATIONS.find(n=>n.id===randFoe)?.name}. Damage: -${allyDmg}HP`});
        setWarLog(l=>[...logEntries,...l].slice(0,30));
      },(activeFoes.length+i+1)*1500);
    });

    setWarLog(l=>[...logEntries,...l].slice(0,30));
    setTension(t=>Math.min(100,t+8));

    // Check war end
    setTimeout(()=>checkWarEnd(warData),5000);
    setPendingTarget(null);
    setSelectedAction(null);
  }

  function getReaction(foe,target,turn){
    const reactions={
      russia:[
        "Dead Hand system activated. Sarmat ICBM launches from Siberia. Belarus mobilizes. SCO emergency summit.",
        "Kinzhal hypersonic missiles inbound. S-500 activates. China backs unconditionally.",
        "Nuclear submarine surfaces in Arctic. Poseidon torpedo detected. Oil embargo declared.",
        "Russia invokes Article 51. Full nuclear triad response initiated. World holds breath.",
      ],
      us:["NATO Article 5 invoked. 29 nations mobilize. Carrier groups converge. Markets crash 40%.","F-35 stealth squadrons deployed. AEGIS fleet goes hot. UK and France raise DEFCON 2.","Cyber Command attacks infrastructure. THAAD intercepts incoming. Congressional war declaration."],
      china:["DF-41 ICBMs raised to launch readiness. Pacific fleet deploys. BeiDou navigation jams GPS.","Hypersonic glide vehicles inbound. Anti-satellite weapons fire. Taiwan Strait blockaded.","China activates SCO mutual defense. Quantum radar locks targets. Economic warfare declared."],
      india:["Agni-V ICBM launched from mobile platform. INS Arihant SSBN surfaces. BrahMos volley fired.","S-400 activates. DRDO directed energy weapons deploy. Russia provides intelligence support."],
      pakistan:["Nasr tactical nukes positioned at forward line. Shaheen-3 fueled. China issues blank check.","ISI activates deep assets. JF-17s scramble. Full mobilization. India red line crossed."],
      nkorea:["Kim disappears underground. Hwasong-17 raised. Cyber Bureau 121 attacks global infrastructure.","EMP weapon detonated over Pacific. KN-23 tactical nukes deployed along DMZ."],
      iran:["Strait of Hormuz closed. Oil hits $400/barrel. Hezbollah, Houthi, Hamas activate simultaneously.","Proxy network activates across 7 countries. Covert warheads moved to launch positions. Unconfirmed."],
      israel:["Samson Option invoked. Jericho-3 missiles target regional capitals. Dolphin subs surface.","Unit 8200 executes simultaneous cyberattack on 12 nations. Iron Dome repels incoming. Arrow-3 launches."],
    };
    const lines=reactions[foe.id]||[`${foe.name} retaliates with full military force. Allies mobilize. UN emergency session called.`];
    return lines[Math.min(Math.floor((turn-1)/3),lines.length-1)];
  }

  function checkWarEnd(warData){
    setNationStates(prev=>{
      const attackHP=warData.sides.attackers.reduce((a,id)=>a+(prev[id]?.hp||0),0)/warData.sides.attackers.length;
      const defHP=warData.sides.defenders.reduce((a,id)=>a+(prev[id]?.hp||0),0)/warData.sides.defenders.length;
      const totalHP=attackHP+defHP;
      if(totalHP<40){
        setWarResult({outcome:"mutualDestruction",text:WAR_OUTCOMES.mutualDestruction});
        setPhase("RESOLVED");setActiveWar(null);
      } else if(attackHP<20){
        setWarResult({outcome:warData.playerSide==="attackers"?"SCO_wins":"NATO_wins",text:WAR_OUTCOMES[warData.playerSide==="attackers"?"SCO_wins":"NATO_wins"]});
        setPhase("RESOLVED");setActiveWar(null);
      } else if(defHP<20){
        setWarResult({outcome:warData.playerSide==="attackers"?"NATO_wins":"SCO_wins",text:WAR_OUTCOMES[warData.playerSide==="attackers"?"NATO_wins":"SCO_wins"]});
        setPhase("RESOLVED");setActiveWar(null);
      } else if(tension>=85){
        setWarResult({outcome:"diplomatic",text:WAR_OUTCOMES.diplomatic});
        setPhase("RESOLVED");setActiveWar(null);
      }
      return prev;
    });
  }

  function initiateWar(targetNation){
    if(!player)return;
    const playerAllies=player.allies.filter(id=>NATIONS.find(n=>n.id===id));
    const enemyAllies=[targetNation.id,...(targetNation.allies||[]).filter(id=>id!==player.id)];
    const attackerSide=[player.id,...playerAllies.filter(id=>!enemyAllies.includes(id))];
    const war={
      attacker:player.id,
      defender:targetNation.id,
      sides:{attackers:attackerSide,defenders:enemyAllies},
      playerSide:"attackers",
      turn:1,
    };
    setActiveWar(war);
    setPhase("ESCALATION");
    addLog({turn:0,type:"war_start",text:`WAR DECLARED: ${player.flag} ${player.name} vs ${targetNation.flag} ${targetNation.name}. ${attackerSide.length} nations on your side. ${enemyAllies.length} against you.`});
    setNarrator(`War declared against ${targetNation.name}. ${player.name} coalition: ${attackerSide.length} nations. Enemy coalition: ${enemyAllies.length} nations. This is fine.`);

    // Enemy declaration response
    setTimeout(()=>{
      addLog({turn:0,type:"response",text:`${targetNation.flag} ${targetNation.name}: "${targetNation.fp}"`});
    },1000);
    setPendingTarget(null);
  }

        setTimeout(()=>{c.remove();p.remove();},5000);
      }
    }
  }

                <span style={{fontSize:22}}>{showSpecials.flag}</span>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:showSpecials.color}}>{showSpecials.name}</div>
                  <div style={{fontSize:9,color:"#64748b"}}>{showSpecials.bloc} · GDP: ${showSpecials.gdp}T</div>
                </div>
              </div>
              <button onClick={()=>setShowSpecials(null)} style={{background:"transparent",border:"none",color:"#64748b",cursor:"pointer",fontSize:14}}>✕</button>
            </div>
            <div style={{fontSize:9,color:"#fbbf24",letterSpacing:2,marginBottom:6}}>SPECIAL CAPABILITIES</div>
            {showSpecials.specials.map((s,i)=>(
              <div key={i} style={{fontSize:10,color:"#94a3b8",marginBottom:4,lineHeight:1.5}}>▸ {s}</div>
            ))}
            <div style={{marginTop:8,padding:"6px 8px",background:"rgba(255,255,255,0.03)",borderRadius:3,fontSize:10,color:"#64748b",fontStyle:"italic",lineHeight:1.5}}>"{showSpecials.fp}"</div>
            {showSpecials.covert>0&&(
              <div style={{marginTop:6,fontSize:10,color:"#a78bfa"}}>⚠ INTELLIGENCE: ~{showSpecials.covert} covert warheads (unconfirmed)</div>
            )}
          </div>
        )}

        {/* War log panel */}
        {showLog&&(
          <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",zIndex:600,background:"#0d1117",border:"1px solid #1e293b",padding:"10px",borderRadius:6,width:420,maxHeight:"60%",overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{fontSize:9,color:"#475569",letterSpacing:2,marginBottom:6,display:"flex",justifyContent:"space-between"}}>
              <span>WAR LOG</span><button onClick={()=>setShowLog(false)} style={{background:"transparent",border:"none",color:"#64748b",cursor:"pointer",fontSize:12}}>✕</button>
            </div>
            <div style={{overflowY:"auto",flex:1}}>
              {warLog.length===0?<div style={{fontSize:10,color:"#334155"}}>No events yet.</div>:warLog.map((l,i)=>(
                <div key={i} style={{fontSize:10,color:i===0?"#94a3b8":i<3?"#64748b":"#334155",marginBottom:5,lineHeight:1.5,borderLeft:"2px solid "+(l.type==="war_start"?"#ef4444":l.type==="retaliation"?"#f97316":l.type==="ally"?"#10b981":l.type==="history"?"#6366f1":"#334155"),paddingLeft:6}}>{l.text}</div>
              ))}
            </div>
          </div>
        )}

        {/* Click hint for map mode without player */}
        {screen==="game"&&!player&&(
          <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",color:"#fbbf24",fontSize:14,letterSpacing:3,textAlign:"center",pointerEvents:"none",zIndex:400,textShadow:"0 0 20px #fbbf2466"}}>
            CLICK ANY NATION<br/><span style={{fontSize:11,color:"#94a3b8"}}>TO BECOME ITS PRESIDENT</span>
          </div>
        )}
      </div>

      {/* Bottom panel */}
      <div style={{display:"flex",height:140,borderTop:"1px solid #1e293b",flexShrink:0,background:"#0d1117"}}>
        {/* Trump narrator */}
        <div style={{width:260,padding:"8px 12px",borderRight:"1px solid #1e293b",overflow:"hidden",flexShrink:0}}>
          <div style={{fontSize:9,color:"#475569",letterSpacing:2,marginBottom:6}}>NARRATOR</div>
          <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
            <TrumpFace size={44}/>
            <div style={{fontSize:10,color:"#94a3b8",fontStyle:"italic",lineHeight:1.6}}>"{narrator}"</div>
          </div>
        </div>
        {/* Situation room */}
        <div style={{flex:1,padding:"8px 12px",borderRight:"1px solid #1e293b",overflow:"hidden"}}>
          <div style={{fontSize:9,color:"#475569",letterSpacing:2,marginBottom:6}}>SITUATION ROOM</div>
          {activeWar?(
            <div>
              <div style={{fontSize:10,color:"#ef4444",marginBottom:4}}>⚔ ACTIVE WAR — Turn {turn}</div>
              <div style={{fontSize:10,color:"#64748b",marginBottom:4}}>Your coalition ({activeWar.sides.attackers.length} nations) vs enemy ({activeWar.sides.defenders.length} nations)</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {activeWar.sides.attackers.map(id=>{const n=NATIONS.find(x=>x.id===id);const ns=nationStates[id];return n?<span key={id} style={{fontSize:10,color:n.color,border:"1px solid "+n.color+"44",padding:"1px 5px",borderRadius:2}}>{n.flag} {Math.round(ns?.hp||0)}%</span>:null;})}
                <span style={{fontSize:10,color:"#334155"}}>vs</span>
                {activeWar.sides.defenders.map(id=>{const n=NATIONS.find(x=>x.id===id);const ns=nationStates[id];return n?<span key={id} style={{fontSize:10,color:"#ef4444",border:"1px solid #ef444444",padding:"1px 5px",borderRadius:2}}>{n.flag} {Math.round(ns?.hp||0)}%</span>:null;})}
              </div>
              <div style={{marginTop:6,fontSize:10,color:"#64748b"}}>Click any enemy nation on map to attack. Click LOG to see war history.</div>
            </div>
          ):(
            <div style={{fontSize:11,color:"#334155",lineHeight:1.8}}>
              {screen==="timeline"?"Click year buttons to navigate nuclear history. Click nation markers for details.":player?"Click any nation on the map to declare war, launch strikes, or view capabilities.":"Click any nation flag on the map to become its President."}
            </div>
          )}
        </div>
        {/* Nation stats */}
        {player&&ns&&(
          <div style={{width:200,padding:"8px 12px",overflow:"hidden",flexShrink:0}}>
            <div style={{fontSize:9,color:"#475569",letterSpacing:2,marginBottom:6}}>YOUR STATUS</div>
            {[
              {label:"HP",val:Math.round(ns.hp),max:100,col:ns.hp>60?"#10b981":ns.hp>30?"#f59e0b":"#ef4444"},
              {label:"WARHEADS",val:ns.warheads,max:getWarheads(player),col:"#fbbf24"},
              {label:"TENSION",val:Math.round(tension),max:100,col:tensionColor},
            ].map(s=>(
              <div key={s.label} style={{marginBottom:6}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#475569",marginBottom:2}}><span>{s.label}</span><span style={{color:s.col,fontWeight:700}}>{s.val}</span></div>
                <div style={{height:4,background:"#1e293b",borderRadius:2}}><div style={{height:"100%",width:Math.min(100,(s.val/s.max)*100)+"%",background:s.col,borderRadius:2,transition:"width 0.5s"}}/></div>
              </div>
            ))}
            <button onClick={()=>setShowSpecials(player)} style={{width:"100%",marginTop:4,padding:"4px",background:"transparent",border:"1px solid "+player.color+"44",color:player.color,fontSize:9,fontFamily:"'Courier New',monospace",cursor:"pointer",borderRadius:2}}>VIEW CAPABILITIES</button>
          </div>
        )}
      </div>
    </div>
  );
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return r+","+g+","+b;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
